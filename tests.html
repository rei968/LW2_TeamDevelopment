<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineSphere 🧪 — Автоматизований тестовий раннер (QA Suite)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <style>
    :root {
      --test-pass: #10b981;
      --test-pass-bg: rgba(16, 185, 129, 0.12);
      --test-fail: #ef4444;
      --test-fail-bg: rgba(239, 68, 68, 0.15);
      --test-card-bg: rgba(26, 34, 53, 0.7);
      --font-mono: 'JetBrains Mono', monospace, Consolas;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--color-bg-primary, #0a0e17);
      color: var(--color-text-primary, #f8fafc);
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
      background-image: 
        radial-gradient(ellipse at top left, rgba(56, 189, 248, 0.08), transparent 50%),
        radial-gradient(ellipse at bottom right, rgba(168, 85, 247, 0.08), transparent 50%);
    }

    .container { max-width: 960px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--color-border, #1e293b);
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: inherit;
    }

    .brand h1 { font-size: 1.5rem; font-weight: 800; }
    .brand span { color: var(--color-cyan, #38bdf8); }

    .header-actions { display: flex; gap: 0.75rem; }

    .btn {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .btn-primary { background: linear-gradient(135deg, #38bdf8, #818cf8); color: #0a0e17; border: none; }
    .btn-outline { background: transparent; border: 1px solid var(--color-border, #334155); color: var(--color-text-secondary, #94a3b8); }
    .btn-outline:hover { border-color: var(--color-cyan, #38bdf8); color: var(--color-text-primary, #f8fafc); }

    .summary-card {
      background: var(--test-card-bg);
      border: 1px solid var(--color-border, #1e293b);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      backdrop-filter: blur(8px);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1.5rem;
    }

    .metric-box { display: flex; flex-direction: column; gap: 0.25rem; }
    .metric-label { font-size: 0.8125rem; color: var(--color-text-muted, #64748b); text-transform: uppercase; font-weight: 600; }
    .metric-value { font-size: 2rem; font-weight: 800; font-family: var(--font-mono); }
    .metric-value.pass { color: var(--test-pass); }
    .metric-value.fail { color: var(--test-fail); }
    .metric-value.total { color: var(--color-cyan, #38bdf8); }
    .metric-value.time { color: var(--color-text-secondary, #94a3b8); font-size: 1.5rem; }

    .suite-card {
      background: var(--test-card-bg);
      border: 1px solid var(--color-border, #1e293b);
      border-radius: 12px;
      margin-bottom: 1.5rem;
      overflow: hidden;
      backdrop-filter: blur(8px);
    }

    .suite-header {
      padding: 1rem 1.25rem;
      background: rgba(15, 23, 42, 0.6);
      border-bottom: 1px solid var(--color-border, #1e293b);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .suite-title { font-size: 1.125rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
    .suite-stats { font-size: 0.8125rem; font-family: var(--font-mono); color: var(--color-text-secondary, #94a3b8); }

    .test-list { list-style: none; }
    .test-item {
      padding: 0.875rem 1.25rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      font-size: 0.9375rem;
    }
    .test-item:last-child { border-bottom: none; }
    .test-status-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-family: var(--font-mono);
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .status-pass { background: var(--test-pass-bg); color: var(--test-pass); border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-fail { background: var(--test-fail-bg); color: var(--test-fail); border: 1px solid rgba(239, 68, 68, 0.4); }

    .test-content { flex: 1; }
    .test-title { color: var(--color-text-primary, #f8fafc); line-height: 1.4; }
    .test-duration { font-size: 0.75rem; color: var(--color-text-muted, #64748b); font-family: var(--font-mono); margin-left: 0.5rem; }
    .test-error {
      margin-top: 0.5rem;
      padding: 0.625rem;
      background: #0f172a;
      border-left: 3px solid var(--test-fail);
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      color: #fca5a5;
      white-space: pre-wrap;
    }

    footer {
      margin-top: 3rem;
      text-align: center;
      font-size: 0.8125rem;
      color: var(--color-text-muted, #64748b);
      padding-top: 1.5rem;
      border-top: 1px solid var(--color-border, #1e293b);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <a href="index.html" class="brand">
        <span style="font-size: 1.75rem;">🎬</span>
        <div>
          <h1>Cine<span>Sphere</span> QA Tests</h1>
          <div style="font-size: 0.8125rem; color: var(--color-text-muted);">
            👤 Відповідальний тестувальник: <strong>Ілля</strong> (Гілка: <code>feature/illia-qa-tests</code>)
          </div>
        </div>
      </a>
      <div class="header-actions">
        <a href="index.html" class="btn btn-outline">← До афіші</a>
        <button id="btn-rerun" class="btn btn-primary">🔄 Запустити тести</button>
      </div>
    </header>

    <!-- Summary Metrics -->
    <section class="summary-card" aria-label="Статистика тестування">
      <div class="metric-box">
        <span class="metric-label">Всього тестів</span>
        <span id="metric-total" class="metric-value total">0</span>
      </div>
      <div class="metric-box">
        <span class="metric-label">Пройдено</span>
        <span id="metric-passed" class="metric-value pass">0</span>
      </div>
      <div class="metric-box">
        <span class="metric-label">Помилок</span>
        <span id="metric-failed" class="metric-value fail">0</span>
      </div>
      <div class="metric-box">
        <span class="metric-label">Час виконання</span>
        <span id="metric-time" class="metric-value time">0 ms</span>
      </div>
    </section>

    <!-- Test Suites Output Container -->
    <main id="suites-container" aria-live="polite">
      <div style="text-align: center; padding: 2rem; color: var(--color-text-muted);">
        Виконання тестів...
      </div>
    </main>

    <footer>
      <p>Лабораторна робота №2 • Зона QA: <strong>Ілля</strong></p>
      <p style="margin-top: 4px;">Модулі для тестування: <code>js/pricing.js</code>, <code>js/booking.js</code>, <code>js/db.js</code></p>
    </footer>
  </div>

  <!-- Test Framework & Test Suites for Illia -->
  <script type="module">
    import { db } from './js/db.js';
    import { pricing, calculateTicketPrice, calculateSeatPrice, calculateOrderTotal, applyPromo } from './js/pricing.js';
    import { booking } from './js/booking.js';

    // Вбудований мікро-раннер тестів
    class MiniTestRunner {
      constructor() {
        this.suites = [];
        this.currentSuite = null;
      }

      describe(title, fn) {
        const suite = { title, tests: [] };
        this.suites.push(suite);
        this.currentSuite = suite;
        fn();
        this.currentSuite = null;
      }

      it(title, fn) {
        if (!this.currentSuite) throw new Error("it() must be inside describe()");
        this.currentSuite.tests.push({ title, fn });
      }

      async run() {
        const startTime = performance.now();
        let total = 0;
        let passed = 0;
        let failed = 0;
        const results = [];

        for (const suite of this.suites) {
          const suiteResult = { title: suite.title, tests: [], passed: 0, failed: 0 };
          for (const test of suite.tests) {
            total++;
            const tStart = performance.now();
            let testPass = true;
            let errorMsg = null;
            try {
              await test.fn();
              passed++;
              suiteResult.passed++;
            } catch (err) {
              testPass = false;
              failed++;
              suiteResult.failed++;
              errorMsg = err.message || String(err);
            }
            const tEnd = performance.now();
            suiteResult.tests.push({
              title: test.title,
              passed: testPass,
              duration: Math.round(tEnd - tStart),
              error: errorMsg
            });
          }
          results.push(suiteResult);
        }

        const endTime = performance.now();
        return {
          total,
          passed,
          failed,
          duration: Math.round(endTime - startTime),
          suites: results
        };
      }
    }

    function expect(actual) {
      return {
        toBe(expected) {
          if (actual !== expected) throw new Error(`Очікувалось: ${JSON.stringify(expected)}, отримано: ${JSON.stringify(actual)}`);
        },
        toEqual(expected) {
          const a = JSON.stringify(actual);
          const b = JSON.stringify(expected);
          if (a !== b) throw new Error(`Об'єкти не рівні!\nОчікувалось: ${b}\nОтримано: ${a}`);
        },
        toBeTruthy() {
          if (!actual) throw new Error(`Очікувалось truthy, отримано: ${actual}`);
        },
        toBeGreaterThan(expected) {
          if (!(actual > expected)) throw new Error(`Очікувалось > ${expected}, отримано: ${actual}`);
        },
        toThrow(expectedText) {
          let threw = false;
          let err = null;
          try { actual(); } catch (e) { threw = true; err = e; }
          if (!threw) throw new Error('Очікувалась помилка (Exception), але виклик пройшов успішно');
          if (expectedText && !err.message.includes(expectedText)) {
            throw new Error(`Помилка виникла, але повідомлення "${err.message}" не містить "${expectedText}"`);
          }
        }
      };
    }

    /**
     * 📌 ЗОНА ВІДПОВІДАЛЬНОСТІ ІЛЛІ (QA ENGINEER)
     * Гілка: feature/illia-qa-tests
     * 
     * TODO: Ілля пише тести для перевірки коду Яріка та бази даних:
     */
    function setupTests(runner) {
      // Базовий смоук-тест структури даних
      runner.describe('1. Базові перевірки каталогу (Smoke Tests)', () => {
        runner.it('Каталог фільмів завантажується зі сховища', () => {
          const movies = db.getMovies();
          expect(Array.isArray(movies)).toBeTruthy();
          expect(movies.length).toBeGreaterThan(0);
        });
      });

      // TODO (Ілля): Додати тести для модуля ціноутворення (js/pricing.js)
      runner.describe('2. Тести ціноутворення (TODO: Ілля)', () => {
        runner.it('Базова ціна повертає числове значення', () => {
          const price = calculateTicketPrice(150, 'standard', false);
          expect(typeof price).toBe('number');
        });
        // TODO: Написати перевірку VIP націнки (+50 грн)
        // TODO: Написати перевірку студентської знижки (15%)
        // TODO: Написати перевірку промокодів (STUDENT10, CINE20)
      });

      // TODO (Ілля): Додати тести для модуля бронювання (js/booking.js)
      runner.describe('3. Тести бронювання та валідації (TODO: Ілля)', () => {
        runner.it('Сітка залу генерує масив рядів', () => {
          const grid = booking.getSeatGrid('showtime-dune-1');
          expect(Array.isArray(grid)).toBeTruthy();
        });
        // TODO: Написати перевірку ліміту (заборона більше 6 місць)
        // TODO: Написати перевірку валідації імені та телефону клієнта
        // TODO: Написати перевірку захисту від double-booking
      });
    }

    function renderResults(report) {
      document.getElementById('metric-total').textContent = report.total;
      document.getElementById('metric-passed').textContent = report.passed;
      document.getElementById('metric-failed').textContent = report.failed;
      document.getElementById('metric-time').textContent = `${report.duration} ms`;

      const container = document.getElementById('suites-container');
      container.innerHTML = '';

      report.suites.forEach(suite => {
        const card = document.createElement('section');
        card.className = 'suite-card';

        const header = document.createElement('div');
        header.className = 'suite-header';
        header.innerHTML = `
          <div class="suite-title">
            <span>📦</span>
            <span>${suite.title}</span>
          </div>
          <div class="suite-stats">
            <span style="color: var(--test-pass); font-weight: 700;">✓ ${suite.passed}</span>
            ${suite.failed > 0 ? `<span style="color: var(--test-fail); font-weight: 700; margin-left: 8px;">✕ ${suite.failed}</span>` : ''}
          </div>
        `;

        const list = document.createElement('ul');
        list.className = 'test-list';

        suite.tests.forEach(test => {
          const item = document.createElement('li');
          item.className = `test-item ${test.passed ? 'pass' : 'fail'}`;
          item.innerHTML = `
            <span class="test-status-badge ${test.passed ? 'status-pass' : 'status-fail'}">
              ${test.passed ? 'PASS' : 'FAIL'}
            </span>
            <div class="test-content">
              <div class="test-title">
                ${test.title}
                <span class="test-duration">${test.duration}ms</span>
              </div>
              ${test.error ? `<div class="test-error">${test.error}</div>` : ''}
            </div>
          `;
          list.appendChild(item);
        });

        card.appendChild(header);
        card.appendChild(list);
        container.appendChild(card);
      });
    }

    async function startTestExecution() {
      const runner = new MiniTestRunner();
      setupTests(runner);
      const report = await runner.run();
      renderResults(report);
    }

    document.getElementById('btn-rerun').addEventListener('click', startTestExecution);
    startTestExecution();
  </script>
</body>
</html>
